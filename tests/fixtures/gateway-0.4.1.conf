server { listen 80; server_name demo.example.com; location ^~ /.well-known/acme-challenge/ { root /var/www/awesome-acme; default_type text/plain; } location / { return 308 https://demo.example.com$request_uri; } }

server {
listen 443 ssl; server_name demo.example.com;
ssl_certificate /etc/letsencrypt/live/demo.example.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
access_log /var/log/nginx/awesome-gateway-probes.log awesome_probe if=$awesome_is_probe;
location ^~ /.well-known/acme-challenge/ { root /var/www/awesome-acme; default_type text/plain; }
location = /abc {
proxy_pass http://127.0.0.1:20001/;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_redirect off;
}
location ^~ /abc/ {
proxy_pass http://127.0.0.1:20001/;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_redirect off;
}
location / { return 404; }
}
