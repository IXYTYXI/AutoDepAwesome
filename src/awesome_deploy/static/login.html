<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172534">
  <title>登录 · Awesome 自动部署</title>
  <link rel="stylesheet" href="/assets/app.css?v=0.9.0">
  <link rel="stylesheet" href="/assets/auth.css?v=0.9.0">
  <script src="/assets/login.js?v=0.9.14" defer></script>
<link rel="stylesheet" href="/assets/theme.css?v=0.10.0">
</head>
<body class="login-page">
  <a class="skip-link" href="#login-main">跳到登录</a>
  <main id="login-main" class="login-main">
    <span class="brand" translate="no"><span class="brand-mark" aria-hidden="true">A</span> AWESOME / DEPLOY</span>
    <section class="login-story" aria-label="平台说明"><p class="eyebrow">AWESOME / CONTROL PLANE</p><p class="login-story-title">让每次上线<br>都有据可查。</p><p>从仓库版本到运行服务，集中完成部署、健康检查与状态追踪。</p><div class="login-steps" aria-label="部署流程"><span>01 获取代码</span><span>02 构建验证</span><span>03 HTTPS 发布</span></div></section>
    <section class="panel login-panel" aria-labelledby="login-title">
      <p class="eyebrow">统一身份 · 安全访问</p>
      <h1 id="login-title">登录自动部署平台</h1>
      <p class="login-description">使用公司飞书账号，进入部署控制台。</p>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <a id="feishu-login" class="login-button" href="/auth/feishu/start"><span id="feishu-login-label">使用飞书登录</span><span aria-hidden="true">↗</span></a>
      <p class="login-help">登录后可使用已获授权的平台功能。若无法进入，请联系平台管理员确认访问权限。</p>
      <noscript><p class="login-help">飞书登录可正常继续；使用部署控制台需要在浏览器中启用 JavaScript。</p></noscript>
    </section>
    <p class="login-footer">Awesome 自动部署 · 让项目从代码走向服务</p>
  </main>
</body>
</html>
