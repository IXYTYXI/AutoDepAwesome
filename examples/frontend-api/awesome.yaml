schemaVersion: 2
app:
  name: 前端与接口演示
  description: 前端和 API 分别运行，同域名按路径分流
  subdomain: demoapi
services:
  web:
    kind: web
    build:
      context: .
      dockerfile: Dockerfile
    port: 8080
    env:
      APP_MODE: web
      PORT: "8080"
    resources:
      cpu: 0.5
      memoryMiB: 128
    healthcheck:
      type: http
      path: /healthz
  api:
    kind: web
    build:
      context: .
      dockerfile: Dockerfile
    port: 8080
    env:
      APP_MODE: api
      PORT: "8080"
    resources:
      cpu: 0.5
      memoryMiB: 128
    healthcheck:
      type: http
      path: /healthz
routes:
  - path: /
    match: prefix
    service: web
    stripPrefix: false
  - path: /abc
    match: prefix
    service: api
    stripPrefix: true
