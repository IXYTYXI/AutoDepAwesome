# Declaration template: provide the project's own Dockerfile and an application using /data.
schemaVersion: 2
app:
  name: 持久服务声明示例
  description: 仅展示持久卷声明，需配套实际业务源码和 Dockerfile
  subdomain: demodat
services:
  web:
    kind: web
    build:
      context: .
      dockerfile: Dockerfile
    port: 8080
    resources:
      cpu: 0.5
      memoryMiB: 128
    storage:
      name: data
      mountPath: /data
      sizeMiB: 50
      maxInodes: 10000
    healthcheck:
      type: http
      path: /healthz
routes:
  - path: /
    match: prefix
    service: web
    stripPrefix: false
